<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <title>Amore e Distopia — Player</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 700px;
        margin: 40px auto;
        padding: 0 20px;
        background: #f5f5f5;
      }
      h1 {
        font-size: 1.2rem;
        margin-bottom: 20px;
      }
      .playlist {
        list-style: none;
        padding: 0;
        margin: 0 0 24px 0;
      }
      .playlist li {
        padding: 10px 14px;
        margin-bottom: 6px;
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.9rem;
      }
      .playlist li:hover {
        background: #eef;
      }
      .playlist li.active {
        background: #dde8ff;
        border-color: #668;
        font-weight: bold;
      }
      .player-box {
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 4px;
        padding: 16px;
      }
      .now-playing {
        font-size: 0.85rem;
        color: #555;
        margin-bottom: 10px;
        min-height: 1.2em;
      }
      audio {
        width: 100%;
      }
      .controls {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      button {
        padding: 6px 14px;
        font-size: 0.85rem;
        cursor: pointer;
        border: 1px solid #aaa;
        border-radius: 4px;
        background: #fff;
      }
      button:hover {
        background: #eee;
      }
    </style>
  </head>
  <body>
    <h1>🎵 Amore e Distopia</h1>

    <ul class="playlist" id="playlist"></ul>

    <div class="player-box">
      <div class="now-playing" id="now-playing">Seleziona una canzone</div>
      <audio id="audio" controls></audio>
      <div class="controls">
        <button onclick="prev()">⏮ Precedente</button>
        <button onclick="next()">Successiva ⏭</button>
      </div>
    </div>

    <script>
      const songs = [
        "AMORE E DISTOPIA - MST V1 Morbido.mp3",
        "AMORE E DISTOPIA - MST V2 Xtra Dettaglio.mp3",
        "ATENA - MST V1 Morbido.mp3",
        "ATENA - MST V2 Xtra Dettaglio.mp3",
        "COME UN'ONDA - MST V1 Morbido.mp3",
        "COME UN'ONDA - MST V2 Xtra Dettaglio.mp3",
        "NEL PROFONDO DELL'UNIVERSO - MST V1 Morbido.mp3",
        "NEL PROFONDO DELL'UNIVERSO - MST V2 Xtra Dettaglio.mp3",
        "PERLA IN DONO AL MARE - MST V1 Morbido.mp3",
        "PERLA IN DONO AL MARE - MST V2 Xtra Dettaglio.mp3",
      ];

      const basePath = "songs/";
      let current = -1;

      const audio = document.getElementById("audio");
      const nowPlaying = document.getElementById("now-playing");
      const playlist = document.getElementById("playlist");

      songs.forEach((name, i) => {
        const li = document.createElement("li");
        li.textContent = name.replace(".mp3", "");
        li.onclick = () => play(i);
        playlist.appendChild(li);
      });

      function play(index) {
        current = index;
        const items = playlist.querySelectorAll("li");
        items.forEach((li) => li.classList.remove("active"));
        items[index].classList.add("active");
        audio.src = basePath + songs[index];
        nowPlaying.textContent = "▶ " + songs[index].replace(".mp3", "");
        audio.play();
      }

      function prev() {
        if (current > 0) play(current - 1);
      }

      function next() {
        if (current < songs.length - 1) play(current + 1);
      }

      audio.addEventListener("ended", () => next());
    </script>
  </body>
</html>
